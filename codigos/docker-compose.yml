# Sobe tudo: banco (Postgres) → preparar-banco (Prisma db push + seed) → backend → frontend.
# Uso: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: moeda
      POSTGRES_PASSWORD: moeda
      POSTGRES_DB: moeda
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moeda -d moeda"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Provedor de Email de desenvolvimento: captura os emails enviados pelo sistema.
  # Interface para ler as mensagens: http://localhost:8025
  email:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # Cria as tabelas a partir do schema.prisma e popula os dados de teste (idempotente).
  preparar-banco:
    build: ./backend
    command: sh -c "bunx prisma db push && bun src/scripts/seed.ts"
    environment: &ambiente-backend
      DATABASE_URL: postgresql://moeda:moeda@db:5432/moeda
      JWT_SECRET: segredo-de-desenvolvimento-troque-em-producao
      PORT: "3000"
      SMTP_HOST: email
      SMTP_PORT: "1025"
      EMAIL_REMETENTE: moeda-estudantil@localhost
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: ./backend
    environment: *ambiente-backend
    ports:
      - "3000:3000"
    depends_on:
      preparar-banco:
        condition: service_completed_successfully
      email:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  dados-postgres:
