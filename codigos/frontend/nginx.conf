server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # A View chama /api/...; o Controller (backend) não usa prefixo.
  location /api/ {
    proxy_pass http://backend:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
